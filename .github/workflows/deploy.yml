name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; queued runs supersede in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The Web3Forms access key that routes enquiries to the inbox. It is
      # public by design — it ends up in the JS bundle either way — but it
      # lives in repository settings so it can be rotated without a commit.
      # Repo → Settings → Secrets and variables → Actions → VITE_WEB3FORMS_KEY.
      # Unset, the contact form falls back to the visitor's mail client.
      # Prints only a length and a checksum, never the value — enough to prove
      # the secret actually reached this job without exposing it in a log.
      # Prints only a length, never the value — enough to confirm at a glance
      # whether the secret reached this job, without exposing it in a log.
      # Never make this fail the build: an unset key is a valid, intentional
      # state (the contact form falls back to mailto).
      - run: |
          if [ -z "$VITE_WEB3FORMS_KEY" ]; then
            echo "VITE_WEB3FORMS_KEY: EMPTY — contact form will use the mailto fallback"
          else
            echo "VITE_WEB3FORMS_KEY: present, length=${#VITE_WEB3FORMS_KEY}"
          fi
        env:
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}

      - run: npm run build
        env:
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}

      # enablement lets the first run turn Pages on itself, so no manual
      # Settings → Pages step is needed.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
